enrichment_sources_referenced:
- Clearbit Reveal (IP-to-company de-anonymisation)
- Clearbit Enrich (person/company firmographics)
- ZoomInfo
- HubSpot / Salesforce / Outreach contact caches
enrichment_note: >-
  These appear only as cache keys in the deletion receipt. Koala publishes no
  operation that reads an enriched company, visitor, or intent record; that data is
  consumed through the app, warehouse syncs (BigQuery, Snowflake, Hightouch, Census)
  and outbound automations.
gaps:
- No read operation for Profile, Account, IntentSignal, Audience or Play.
- No list/search operation anywhere in the public surface.
- No schema for the webhook payload Koala POSTs to customer endpoints
  (see asyncapi/koala-io-auto-outbound-webhooks.yml).
