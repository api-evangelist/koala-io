aid: koala-io
url: https://raw.githubusercontent.com/api-evangelist/koala-io/refs/heads/main/apis.yml
name: Koala
kind: company
description: Koala is a B2B buyer-intent and go-to-market platform that de-anonymizes website and product
  traffic, identifies the visitors and companies behind it, enriches them with firmographic and contact
  data (via Clearbit Reveal/Enrich and ZoomInfo), and scores first-party intent so sales teams can act
  on the accounts showing the strongest signals. Its developer surface is a client-side JavaScript pixel
  plus an HTTP collection API for server-side identify, event, and account ingestion, with a separate
  secret-key admin API for GDPR deletion.
