  description: The client-side pixel loaded from cdn.getkoala.com/v1/{key}/sdk.js. Exposes ko.identify(),
    ko.track(), ko.qualify(), ko.reset() and autotracks pageviews, form fills, and session time. This
    is a browser SDK, not a REST resource, and it de-anonymizes traffic client-side into the same collection
    pipeline as the Batch API.
