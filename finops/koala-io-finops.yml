- Enrichment
- Go-to-Market
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Koala spend. Koala is a subscription SaaS product rather than a
  metered per-call API, so cost is driven by the plan tier, number of seats, the
  volume of identified visitors, and consumption of enrichment credits (Clearbit
  Reveal/Enrich and ZoomInfo). The pixel and the collection/deletion APIs carry
  no separate per-request charge. Cost optimization is about matching the plan
  to identified-visitor volume and controlling enrichment-credit burn, not about
  per-token or per-call rate shopping.
notes: >-
  Koala does not expose a usage-metered billing API for its endpoints. Track
  spend via the subscription invoice plus in-app credit usage. Verify credit
  allotments and overage behavior with Koala during reconciliation.
sources:
- https://getkoala.com/pricing
- https://getkoala.com/docs/admin-guides/credits-faq
