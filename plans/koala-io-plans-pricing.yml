description: >-
  Koala is sold as seat- and credit-based SaaS, not as a metered per-call API. Access
  to the pixel, the collection API and the GDPR deletion API comes with the workspace
  subscription; there is no separate per-request API price. The published price sheet
  has four tiers — Free, Starter ($200/mo), Growth ($1,000/mo) and Business (custom) —
  and every tier includes "all features"; what changes across tiers is included
  seats, monthly credits, lead-routing sophistication, CRM depth, data retention and
  support. Prices below were read verbatim off the pricing page on 2026-08-13.
notes: >-
  The pricing page carries a site-wide banner: "Koala has been acquired by Cursor and
  will be shutting down on Sept 30". Signup links were still live at probe time, but
  the ingestion API was already returning {"error": "Koala ingest suspended"}. Do not
  treat these tiers as purchasable. Annual billing is offered as a toggle on the page
  but no annual figures are published separately. Enrichment credits are consumed by
  Clearbit Reveal/Enrich and ZoomInfo lookups.
