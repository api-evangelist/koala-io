finding: >-
  Koala's MCP surface and Koala's REST surface do not overlap at all. The MCP server
  is a docs-reading server generated by Mintlify; the REST API is an ingestion and
  erasure API. An agent connected to the Koala MCP server can read Koala's manuals
  but cannot send an identify, send an event, or file a GDPR deletion. This is a
  complete surface divergence, not a coverage gap to be closed — and it will not be
  closed: Koala was acquired by Cursor and the product shuts down 2026-09-30
  (see lifecycle/koala-io-lifecycle.yml).
